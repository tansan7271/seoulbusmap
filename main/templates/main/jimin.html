{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>데이터 시각화 분석 (Jimin's Page)</title>
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <style>
        .visualization-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        .chart-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .map-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
            text-align: center;
        }
        .map-legend {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'index' %}">
            <img src="{% static 'main/images/seoulbusmaplogo.png' %}" alt="서울시 행정동별 버스 인프라 탐색기 로고" class="logo-image" />
        </a>
        <p class="description">
            데이터 분석 시각화 페이지입니다. 거시적 분석과 미시적 분석 결과를 확인하세요.
        </p>

        <div class="selector-form">
            <form id="hjd-form">
                <label for="hjd_code">다른 행정동 바로가기:</label>
                <select name="hjd_code" id="hjd_code" onchange="navigateToHjd()">
                    <option value="">--- 행정동을 선택하세요 ---</option>
                    {% for hjd in hjd_list %}
                    <option value="{{ hjd.district_id }}">{{ hjd.name }}</option>
                    {% endfor %}
                </select>
            </form>
        </div>

        <div class="visualization-container">
            <!-- 1. 거시적 분석 -->
            <div class="chart-container">
                <h2>거시적 분석: 인구수-정류장 수 상관관계</h2>
                <canvas id="scatterChart"></canvas>
            </div>

            <!-- 2. 미시적 분석 -->
            <div class="map-container">
                <h2>미시적 분석: 교통 소외 지역 지도</h2>
                <div id="map" style="height: 600px; width: 100%;"></div>
                <div class="map-legend">
                    <span>소외(부족)</span>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #d73027;"></div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #fc8d59;"></div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #fee08b;"></div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #ffffbf;"></div>
                    </div>
                     <div class="legend-item">
                        <div class="legend-color" style="background-color: #d9ef8b;"></div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #91cf60;"></div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #1a9850;"></div>
                    </div>
                    <span>과잉(충분)</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script>
        function navigateToHjd() {
            const select = document.getElementById("hjd_code");
            const selectedCode = select.value;
            if (selectedCode) {
                window.location.href = `/hangjeongdong/${selectedCode}/`;
            }
        }

        // --- 거시적 분석: 산점도 차트 ---
        document.addEventListener('DOMContentLoaded', function () {
            const scatterData = JSON.parse('{{ scatter_data|safe }}');
            const macroResults = JSON.parse('{{ macro_results|safe }}');

            const points = scatterData.map(d => ({ x: d.population, y: d.busstop_count, name: d.name }));

            // 회귀선 데이터 생성
            const minPop = Math.min(...points.map(p => p.x));
            const maxPop = Math.max(...points.map(p => p.x));
            const regressionLine = [
                { x: minPop, y: macroResults.slope * minPop + macroResults.intercept },
                { x: maxPop, y: macroResults.slope * maxPop + macroResults.intercept }
            ];

            const ctx = document.getElementById('scatterChart').getContext('2d');
            new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: '행정동',
                        data: points,
                        backgroundColor: 'rgba(0, 123, 255, 0.5)'
                    }, {
                        label: '회귀선',
                        data: regressionLine,
                        type: 'line',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 2,
                        fill: false,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            title: {
                                display: true,
                                text: '인구수'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: '버스 정류장 수'
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const point = context.dataset.data[context.dataIndex];
                                    return `${point.name}: (인구: ${point.x}, 정류장: ${point.y})`;
                                }
                            }
                        }
                    }
                }
            });

            // --- 미시적 분석: 지도 색칠하기 (Leaflet + GeoJSON) ---
            const residualMap = JSON.parse('{{ residual_map|safe }}');
            console.log("Keys from Django residualMap:", Object.keys(residualMap)); // 디버깅

            // 1. 지도 초기화
            const map = L.map('map', { 
                zoomControl: false // 확대/축소 버튼 비활성화 (최종)
            }).setView([37.5665, 126.9780], 10); // 서울 중심 좌표 (초기값, fitBounds로 변경될 예정)

            // 2. 배경 타일 레이어 제거됨 (서울 행정동만 표시하기 위함)

            // 3. 색상 스케일 함수
            function getColor(value) {
                if (value === undefined) return '#e0e0e0'; // 데이터 없는 지역
                if (value < -25) return '#d73027'; // 매우 부족 (빨강)
                if (value < -15) return '#fc8d59';
                if (value < -5) return '#fee08b';
                if (value < 5) return '#ffffbf';  // 평균 수준 (노랑)
                if (value < 15) return '#d9ef8b';
                if (value < 25) return '#91cf60';
                return '#1a9850'; // 매우 충분 (녹색)
            }

            // 4. GeoJSON 레이어 스타일 함수
            function style(feature) {
                const districtId = feature.properties.adm_cd2.substring(0, 8);
                const residual = residualMap[districtId];
                
                console.log(`Original adm_cd2: ${feature.properties.adm_cd2}, Used ID: ${districtId}, Looked up residual: ${residual}`); // 디버깅

                return {
                    fillColor: getColor(residual),
                    weight: 1,
                    opacity: 1,
                    color: 'white',
                    dashArray: '3',
                    fillOpacity: 0.7
                };
            }

            let geojsonLayer; // 나중에 참조할 수 있도록 레이어 변수 선언

            // 5. GeoJSON 데이터 로드 및 지도에 추가
            fetch("{% static 'main/svg/hangjeongdong_서울특별시.geojson' %}")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    geojsonLayer = L.geoJSON(data, {
                        style: style,
                        onEachFeature: onEachFeature
                    }).addTo(map);

                    // GeoJSON 로드 후 서울 행정동 영역에 맞춰 지도를 확대/이동
                    map.fitBounds(geojsonLayer.getBounds());
                })
                .catch(error => {
                    console.error('Error loading or processing GeoJSON:', error);
                });

            // 6. 각 폴리곤(행정동)에 대한 인터랙션 정의
            function onEachFeature(feature, layer) {
                layer.on({
                    mouseover: highlightFeature,
                    mouseout: resetHighlight,
                    click: zoomToFeature
                });
            }

            // 마우스오버 하이라이트 효과
            function highlightFeature(e) {
                const layer = e.target;
                layer.setStyle({
                    weight: 3,
                    color: '#666',
                    dashArray: '',
                    fillOpacity: 0.9
                });

                if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                    layer.bringToFront();
                }
                
                // 툴팁 정보 업데이트 (adm_cd2 사용하도록 수정)
                const props = layer.feature.properties;
                const districtId = props.adm_cd2.substring(0, 8);
                const residual = residualMap[districtId];
                const tooltipText = `<strong>${props.adm_nm.split(' ').slice(2).join(' ')}</strong><br>잔차: ${residual !== undefined ? residual.toFixed(2) : 'N/A'}`;
                layer.bindTooltip(tooltipText, {sticky: true}).openTooltip();
            }

            // 마우스아웃 하이라이트 해제
            function resetHighlight(e) {
                geojsonLayer.resetStyle(e.target);
                e.target.closeTooltip();
            }
            
            // 클릭 시 확대
            function zoomToFeature(e) {
                map.fitBounds(e.target.getBounds());
            }
        });
    </script>
</body>
</html>
