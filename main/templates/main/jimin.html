{% load static %}
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>데이터 시각화 분석 (Jimin's Page)</title>
    <link
      rel="icon"
      href="{% static 'main/images/seoulbusmaplogo.png' %}"
      type="image/png"
    />
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      .visualization-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin-top: 20px;
      }
      .chart-container,
      .map-container {
        width: 100%;
        max-width: 600px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f9f9f9;
        position: relative;
      }

      #map {
        height: 600px;
        width: 100%;
        border-radius: 4px;
      }
      .map-legend {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin-top: 10px;
      }
      .legend-color {
        width: 20px;
        height: 20px;
        border: 1px solid #ccc;
      }

      /* 서브 타이틀 스타일 */
      .map-sub-title {
        font-size: 1.1em;
        color: #555;
        margin-bottom: 15px;
        font-weight: bold;
      }

      .reset-btn {
        position: absolute;
        bottom: 70px;
        left: 35px;
        z-index: 1000;
        padding: 6px 12px;
        background-color: white;
        border: 2px solid rgba(0, 0, 0, 0.2);
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
      }
      .reset-btn:hover {
        background-color: #f4f4f4;
      }
      .district-label {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid #bbb;
        border-radius: 4px;
        padding: 1px 5px;
        font-weight: bold;
        font-size: 12px;
        color: #444;
        text-align: center;
        white-space: nowrap;
      }
      .info-text {
        color: #666;
        font-size: 0.9em;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="{% url 'index' %}">
        <img
          src="{% static 'main/images/seoulbusmaplogo.png' %}"
          alt="로고"
          class="logo-image"
        />
      </a>
      <p class="description">
        현재 <strong><span id="map-level-text">서울시 전체</span></strong> 보기
        모드입니다. <br /><span id="map-guide-text" class="info-text"
          >분석할 자치구를 클릭하면 상세 정보가 나타납니다.</span
        >
      </p>

      <div class="visualization-container">
        <div class="chart-container">
          <h2>거시적 분석: 인구수-정류장 수 상관관계</h2>
          <canvas id="scatterChart"></canvas>
        </div>

        <div class="map-container">
          <h2>미시적 분석: 교통 소외 지역 지도</h2>
          <div id="map-sub-title" class="map-sub-title">
            서울시 자치구별 현황
          </div>

          <button class="reset-btn" onclick="resetMap()">전체보기</button>
          <div
            class="toggle-container"
            style="
              position: absolute;
              bottom: 35px;
              left: 35px;
              z-index: 1000;
              background: white;
              padding: 5px 10px;
              border: 2px solid rgba(0, 0, 0, 0.2);
              border-radius: 4px;
              display: flex;
              align-items: center;
              gap: 5px;
            "
          >
            <input
              type="checkbox"
              id="toggle-neighborhood"
              onchange="toggleNeighborhoodMode()"
            />
            <label
              for="toggle-neighborhood"
              style="
                font-size: 13px;
                font-weight: bold;
                cursor: pointer;
                user-select: none;
              "
              >행정동 단위 보기</label
            >
          </div>
          <div id="map"></div>

          <div class="map-legend">
            <span>인프라 부족</span>
            <div class="legend-color" style="background-color: #d73027"></div>
            <div class="legend-color" style="background-color: #fc8d59"></div>
            <div class="legend-color" style="background-color: #ffffbf"></div>
            <div class="legend-color" style="background-color: #d9ef8b"></div>
            <div class="legend-color" style="background-color: #1a9850"></div>
            <span>인프라 충분</span>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      let currentLevel = 0;
      let isAllNeighborhoodMode = false;
      let selectedDistrict = null;
      let geojsonLayer;
      let labelLayerGroup = L.layerGroup();
      const residualMap = JSON.parse("{{ residual_map|escapejs }}");
      const districtResidualMap = JSON.parse(
        "{{ district_residual_map|escapejs }}"
      );

      document.addEventListener("DOMContentLoaded", function () {
        initChart();
        initMap();
      });

      function getColor(value) {
        if (value === undefined || value === null) return "#e0e0e0";
        if (value < -15) return "#d73027";
        if (value < -5) return "#fc8d59";
        if (value < 5) return "#ffffbf";
        if (value < 15) return "#d9ef8b";
        return "#1a9850";
      }

      function initMap() {
        const map = L.map("map", { zoomControl: true }).setView(
          [37.5665, 126.978],
          12
        );
        window.mapObj = map;
        labelLayerGroup.addTo(map);

        fetch("{% static 'main/svg/hangjeongdong_서울특별시.geojson' %}")
          .then((res) => res.json())
          .then((data) => {
            geojsonLayer = L.geoJSON(data, {
              style: mainStyle,
              onEachFeature: onEachFeature,
            }).addTo(map);

            addDistrictLabels(data);
            map.fitBounds(geojsonLayer.getBounds());
          });
      }

      function addDistrictLabels(data) {
        labelLayerGroup.clearLayers();
        let districtNames = [
          ...new Set(
            data.features.map((f) => f.properties.adm_nm.split(" ")[1])
          ),
        ];
        districtNames.forEach((name) => {
          let layers = geojsonLayer
            .getLayers()
            .filter((l) => l.feature.properties.adm_nm.includes(name));
          let group = L.featureGroup(layers);
          let center = group.getBounds().getCenter();
          L.marker(center, {
            icon: L.divIcon({
              className: "district-label",
              html: name,
              iconSize: [45, 22],
            }),
            interactive: false,
          }).addTo(labelLayerGroup);
        });
      }

      function toggleNeighborhoodMode() {
        isAllNeighborhoodMode = document.getElementById(
          "toggle-neighborhood"
        ).checked;
        geojsonLayer.setStyle(mainStyle);
      }

      function mainStyle(feature) {
        const props = feature.properties;
        const dName = props.adm_nm.split(" ")[1];
        const hjdCode = props.adm_cd2.substring(0, 8);
        let styleOptions = {
          fillOpacity: 0.7,
          weight: 1.2,
          opacity: 1,
          color: "#666",
        };

        // If 'All Neighborhood Mode' is ON, always show neighborhood data
        if (isAllNeighborhoodMode) {
          styleOptions.fillColor = getColor(residualMap[hjdCode]);
          // Reduce opacity slightly for dense map
          styleOptions.fillOpacity = 0.8;
          styleOptions.weight = 0.5; // Thinner lines for detailed view
          styleOptions.color = "#ccc";
          return styleOptions;
        }

        if (currentLevel === 0) {
          const guCode = props.adm_cd2.substring(0, 5);
          styleOptions.fillColor = getColor(districtResidualMap[guCode]);
          styleOptions.color = "#888";
          styleOptions.weight = 1.5;
        } else {
          if (dName === selectedDistrict) {
            styleOptions.fillColor = getColor(residualMap[hjdCode]);
            styleOptions.color = "white";
            styleOptions.weight = 1;
          } else {
            styleOptions.fillOpacity = 0.05;
            styleOptions.color = "#eee";
            styleOptions.fillColor = "#eee";
          }
        }
        return styleOptions;
      }

      function onEachFeature(feature, layer) {
        layer.on({
          mouseover: function (e) {
            const props = e.target.feature.properties;

            // If in All Neighborhood Mode, always show neighborhood tooltip
            if (isAllNeighborhoodMode) {
              const hjdName = props.adm_nm.split(" ").slice(2).join(" ");
              let content = `<strong>${hjdName}</strong><br>잔차: ${(
                residualMap[props.adm_cd2.substring(0, 8)] || 0
              ).toFixed(2)}`;
              e.target.bindTooltip(content, { sticky: true }).openTooltip();
              return;
            }

            if (currentLevel === 0) {
              const dName = props.adm_nm.split(" ")[1];
              const guCode = props.adm_cd2.substring(0, 5);
              let content = `<strong>${dName}</strong><br>평균 잔차: ${(
                districtResidualMap[guCode] || 0
              ).toFixed(2)}`;
              e.target.bindTooltip(content, { sticky: true }).openTooltip();
              return;
            }
            const hjdName = props.adm_nm.split(" ").slice(2).join(" ");
            let content = `<strong>${hjdName}</strong><br>잔차: ${(
              residualMap[props.adm_cd2.substring(0, 8)] || 0
            ).toFixed(2)}`;
            e.target.bindTooltip(content, { sticky: true }).openTooltip();
          },
          click: function (e) {
            const dName = e.target.feature.properties.adm_nm.split(" ")[1];
            const districtLayers = geojsonLayer
              .getLayers()
              .filter((l) => l.feature.properties.adm_nm.includes(dName));
            const districtBounds = L.featureGroup(districtLayers).getBounds();

            currentLevel = 1;
            selectedDistrict = dName;

            labelLayerGroup.clearLayers();
            // 서브 타이틀만 변경
            document.getElementById(
              "map-sub-title"
            ).innerText = `${selectedDistrict} 행정동별 상세 분석`;
            document.getElementById("map-level-text").innerText = "행정동 단위";
            document.getElementById("map-guide-text").innerText =
              "행정동별 인프라 수준을 확인 중입니다.";

            window.mapObj.fitBounds(districtBounds, { padding: [20, 20] });
            geojsonLayer.setStyle(mainStyle);
          },
        });
      }

      function resetMap() {
        currentLevel = 0;
        isAllNeighborhoodMode = false;
        document.getElementById("toggle-neighborhood").checked = false;
        selectedDistrict = null;
        // 서브 타이틀 초기화
        document.getElementById("map-sub-title").innerText =
          "서울시 자치구별 현황";
        document.getElementById("map-level-text").innerText = "서울시 전체";
        document.getElementById("map-guide-text").innerText =
          "분석할 자치구를 클릭하면 상세 정보가 나타납니다.";
        window.mapObj.setView([37.5665, 126.978], 11);
        geojsonLayer.setStyle(mainStyle);
        fetch("{% static 'main/svg/hangjeongdong_서울특별시.geojson' %}")
          .then((res) => res.json())
          .then((data) => addDistrictLabels(data));
      }

      function initChart() {
        const scatterData = JSON.parse("{{ scatter_data|escapejs }}");
        const macroResults = JSON.parse("{{ macro_results|escapejs }}");
        const points = scatterData.map((d) => ({
          x: d.population,
          y: d.busstop_count,
          name: d.name,
        }));
        const minPop = Math.min(...points.map((p) => p.x));
        const maxPop = Math.max(...points.map((p) => p.x));
        new Chart(document.getElementById("scatterChart").getContext("2d"), {
          type: "scatter",
          data: {
            datasets: [
              {
                label: "행정동",
                data: points,
                backgroundColor: "rgba(0, 123, 255, 0.5)",
              },
              {
                label: "회귀선",
                data: [
                  {
                    x: minPop,
                    y: macroResults.slope * minPop + macroResults.intercept,
                  },
                  {
                    x: maxPop,
                    y: macroResults.slope * maxPop + macroResults.intercept,
                  },
                ],
                type: "line",
                borderColor: "rgba(255, 99, 132, 1)",
                fill: false,
                pointRadius: 0,
              },
            ],
          },
          options: { responsive: true },
        });
      }
    </script>
  </body>
</html>
